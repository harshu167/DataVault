spring.application.name=DataVault

# Optional local configuration file (ignored by Git)
spring.config.import=optional:file:./application-local.properties

# Server port (Railway provides PORT dynamically)
server.port=${PORT:8080}

# Database configuration (overridable by environment variables)
# Supports full JDBC URL (Aiven MySQL) or individual parameters
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:datavault}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Security & JWT configuration
datavault.jwt.secret=${JWT_SECRET:DataVaultSecretKeyForJWTAuthentication2026SecureProductionGrade256BitKey!}
datavault.jwt.expiration-ms=86400000

# AES-GCM 256-bit encryption key
datavault.encryption.key=${DATAVAULT_ENCRYPTION_KEY:DataVaultAES256SecretEncryptionKey2026!SecureKey}

# File Upload Configuration
datavault.upload.dir=${DATAVAULT_UPLOAD_DIR:./uploads/documents}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# CORS allowed origins (supports localhost + Vercel domains + FRONTEND_URL env var)
datavault.cors.allowed-origins=${FRONTEND_URL:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}